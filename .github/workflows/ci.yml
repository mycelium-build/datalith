name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Create datalith-bot token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ secrets.AUTOMATION_APP_ID }}
                  private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
                  owner: mycelium-build
                  repositories: datalith-app
                  permission-contents: read

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Sync assets
              env:
                  DATALITH_SOURCE_REF: main
                  DATALITH_READ_TOKEN: ${{ steps.app-token.outputs.token }}
              run: npm run sync-assets

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run fmt:check

            - name: Run tests
              run: npm test

            - name: Check license notices
              run: npm run licenses:check

            - name: Check policy pages
              run: npm run policies:check
