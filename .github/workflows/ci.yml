name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

# Cancel superseded pull request runs. Runs on main are never cancelled: each one gates a deployment.
concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Which checks have inputs that changed? Skipping happens at the job and step level, so that a
    # required check that is skipped still counts as passed. See scripts/ci/changes.sh.
    changes:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.changes.outputs.code }}
            licenses: ${{ steps.changes.outputs.licenses }}
            policies: ${{ steps.changes.outputs.policies }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Find the changed files
              id: changes
              env:
                  EVENT: ${{ github.event_name }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  if [ "$EVENT" = pull_request ]; then
                      # The checkout is the merge of the pull request into its base: parent 1 is the base.
                      scripts/ci/changes.sh ci HEAD^1 HEAD
                  else
                      scripts/ci/changes.sh ci "$BEFORE" HEAD
                  fi

    # On main, skip the checks when the pull request that was just merged already verified this tree.
    reuse:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
            checks: read
        outputs:
            verified: ${{ steps.verified.outputs.verified }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  sparse-checkout: scripts/ci
                  persist-credentials: false

            - name: Look for a verified pull request
              id: verified
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.sha }}
              run: scripts/ci/verified-tree.sh

    # Formatting covers Markdown and YAML too, so it runs even when `quality` is skipped for a
    # documentation-only change. It needs no generated data and no token.
    format:
        needs: reuse
        if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Check formatting
              run: npm run fmt:check

    quality:
        needs: [changes, reuse]
        # Skipped only on an explicit answer: the tree was verified (main) or nothing tested changed.
        # Pull requests (reuse is skipped), failed lookups and unknown bases run the full CI.
        if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' && needs.changes.outputs.code != 'false' }}
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Create datalith-bot token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
                  private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
                  owner: mycelium-build
                  repositories: datalith-app
                  permission-contents: read

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate site data
              env:
                  RELEASE_REPOSITORY: mycelium-build/datalith-app
                  DATALITH_SOURCE_REF: main
                  DATALITH_READ_TOKEN: ${{ steps.app-token.outputs.token }}
              run: npm run prebuild

            # `npm run check` includes the formatting check (vp check), so it runs here too.
            - name: Check formatting, lint and types
              run: npm run check

            - name: Run tests
              run: npm test

            - name: Check license notices
              if: needs.changes.outputs.licenses != 'false'
              run: npm run licenses:check

            - name: Check policy pages
              if: needs.changes.outputs.policies != 'false'
              run: npm run policies:check
