name: Deploy website

on:
    workflow_run:
        workflows:
            - CI
        types:
            - completed
        branches:
            - main
    workflow_dispatch:
        inputs:
            source_ref:
                description: Datalith git ref to use for application assets
                required: true
                default: main
                type: string

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    # A push to main that changes nothing the site is built from (README, docs, CI files...) does not
    # need a new deployment. It is safe because the comparison is made against the commit of the last
    # *successful* Pages deployment, not only against the push: a skipped, cancelled or failed
    # deployment leaves its changes in the next comparison. A manual run (new application release,
    # custom source_ref) always deploys. The exclusions are in scripts/ci/changes.sh.
    changes:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: read
        outputs:
            shipped: ${{ steps.changes.outputs.shipped }}
        steps:
            - name: Check out website
              if: github.event_name == 'workflow_run'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Find the changes since the last deployment
              id: changes
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  if [ "${{ github.event_name }}" = workflow_dispatch ]; then
                      echo "shipped=true" >> "$GITHUB_OUTPUT"
                  else
                      scripts/ci/changes.sh deploy "$HEAD_SHA"
                  fi

    build:
        needs: changes
        # A failed or unknown comparison deploys: only an explicit "false" skips the deployment.
        if: >-
            !cancelled() && needs.changes.outputs.shipped != 'false' && (
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main'))
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
        steps:
            - name: Check out website
              if: github.event_name == 'workflow_run'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Check out website for manual deployment
              if: github.event_name == 'workflow_dispatch'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.ref }}

            - name: Create datalith-bot token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
                  private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
                  owner: mycelium-build
                  repositories: datalith-app
                  permission-contents: read

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Check build environment
              env:
                  DATALITH_READ_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  if [ -n "${DATALITH_SOURCE_DIR:-}" ]; then
                      echo "::error::DATALITH_SOURCE_DIR must not be set in CI"
                      exit 1
                  fi
                  if [ -z "${DATALITH_READ_TOKEN}" ]; then
                      echo "::error::DATALITH_READ_TOKEN must be set in CI"
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Sync assets
              env:
                  DATALITH_SOURCE_REF: ${{ inputs.source_ref || 'main' }}
                  DATALITH_READ_TOKEN: ${{ steps.app-token.outputs.token }}
              run: npm run sync-assets

            # Astro writes optimized images to node_modules/.astro/assets (about 20 s cold, 1 s warm).
            # Only runs on main write caches, which every later run (and any branch) can read.
            - name: Restore image cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: node_modules/.astro/assets
                  key: astro-images-${{ runner.os }}-${{ hashFiles('src/assets/**', 'package-lock.json') }}
                  restore-keys: |
                      astro-images-${{ runner.os }}-

            - name: Build site
              env:
                  RELEASE_REPOSITORY: mycelium-build/datalith-app
                  DATALITH_SOURCE_REF: ${{ inputs.source_ref || 'main' }}
                  DATALITH_READ_TOKEN: ${{ steps.app-token.outputs.token }}
              run: npm run build

            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: dist

    # Separate job: "Re-run failed jobs" after a Pages failure reuses the uploaded artifact
    # instead of building the site again.
    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
