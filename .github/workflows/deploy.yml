name: Deploy website

on:
    workflow_run:
        workflows:
            - CI
        types:
            - completed
        branches:
            - main
    workflow_dispatch:
        inputs:
            source_ref:
                description: Datalith git ref to use for documentation
                required: true
                default: main
                type: string

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main')
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Check out website
              if: github.event_name == 'workflow_run'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Check out website for manual deployment
              if: github.event_name == 'workflow_dispatch'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.ref }}

            - name: Create datalith-bot token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
                  private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
                  owner: mycelium-build
                  repositories: datalith-app
                  permission-contents: read

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Check build environment
              env:
                  DATALITH_READ_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  if [ -n "${DATALITH_SOURCE_DIR:-}" ]; then
                      echo "::error::DATALITH_SOURCE_DIR must not be set in CI"
                      exit 1
                  fi
                  if [ -z "${DATALITH_READ_TOKEN}" ]; then
                      echo "::error::DATALITH_READ_TOKEN must be set in CI"
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci

            - name: Sync assets
              env:
                  DATALITH_SOURCE_REF: ${{ inputs.source_ref || 'main' }}
                  DATALITH_READ_TOKEN: ${{ steps.app-token.outputs.token }}
              run: npm run sync-assets

            - name: Build site
              env:
                  RELEASE_REPOSITORY: mycelium-build/datalith-app
                  DATALITH_SOURCE_REF: ${{ inputs.source_ref || 'main' }}
                  DATALITH_READ_TOKEN: ${{ steps.app-token.outputs.token }}
                  SITE_BASE: /datalith
              run: npm run build

            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
