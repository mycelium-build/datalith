name: Dependabot notices

# Dependency updates change THIRD-PARTY-NOTICES.md. Regenerate it on Dependabot pull requests so that
# the license check passes. The commit is pushed with the datalith-bot token so that CI runs again.
#
# Needs AUTOMATION_APP_CLIENT_ID and AUTOMATION_APP_PRIVATE_KEY in the *Dependabot* secrets
# (Settings > Secrets and variables > Dependabot); Dependabot runs cannot read Actions secrets.
# The GitHub App must be installed on this repository with contents: write.

on:
    pull_request:
        paths:
            - package-lock.json

permissions:
    contents: read

jobs:
    notices:
        if: github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest
        steps:
            - name: Check out pull request
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Regenerate license notices
              run: npm run licenses:generate

            - name: Detect changes
              id: diff
              run: |
                  if git diff --quiet -- THIRD-PARTY-NOTICES.md; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            # Created only now: nothing above runs with write access.
            - name: Create datalith-bot token
              if: steps.diff.outputs.changed == 'true'
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
                  private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
                  permission-contents: write

            - name: Commit notices
              if: steps.diff.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  BRANCH: ${{ github.event.pull_request.head.ref }}
                  REPO: ${{ github.repository }}
              run: |
                  git config user.name "datalith-bot"
                  git config user.email "datalith-bot@users.noreply.github.com"
                  git add THIRD-PARTY-NOTICES.md
                  git commit -m "chore(deps): regenerate third-party notices"
                  git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
