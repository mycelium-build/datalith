name: Dependency audit

# Advisories depend on the date, not on a commit: check them once a day on main
# instead of on every pull request, and open an issue when production dependencies are affected.

on:
    schedule:
        - cron: "17 5 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  persist-credentials: false

            - name: Audit production dependencies
              id: audit
              run: |
                  set +e
                  npm audit --omit=dev --audit-level=low 2>&1 | tee audit.txt
                  echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Open or update the issue
              if: steps.audit.outputs.status != '0'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TITLE: Security advisories in production dependencies
              run: |
                  body="$(printf '`npm audit --omit=dev` reports advisories on main (%s).\n\n```\n%s\n```\n' "$(date -u +%F)" "$(head -c 50000 audit.txt)")"
                  number="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
                  if [ -n "$number" ]; then
                      gh issue comment "$number" --body "$body"
                  else
                      gh issue create --title "$TITLE" --body "$body"
                  fi
                  exit 1
