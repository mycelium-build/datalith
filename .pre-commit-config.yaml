# Local Git hooks that mirror CI checks. Managed with prek (a pre-commit compatible runner):
#   prek install          # once per clone; installs the pre-commit and pre-push hooks
#   prek run --all-files  # run every pre-commit hook on the whole tree
# Bypass once with `git commit --no-verify` / `git push --no-verify`. See CONTRIBUTING.md.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
    - repo: local
      hooks:
          # Same tool as CI's "Check formatting, lint and types" step, on the staged files only.
          - id: format
            name: vp fmt --check
            language: system
            entry: npx --no-install vp fmt --check
            types_or: [ts, tsx, javascript, json, css, markdown, yaml, astro]
            exclude: ^(THIRD-PARTY-NOTICES\.md|src/pages/(privacy|terms)/index\.astro)$

          - id: lint
            name: vp lint
            language: system
            # Type-aware lint needs the types generated by `astro sync` (part of `npm run check`).
            entry: bash -c 'test -d .astro || npx --no-install astro sync >/dev/null; exec npx --no-install vp lint "$@"' --
            types_or: [ts, tsx, javascript]

          - id: stylelint
            name: stylelint
            language: system
            entry: npx --no-install stylelint
            files: ^src/styles/.*\.css$

          # The inputs of CI's "Check license notices" step.
          - id: licenses-check
            name: license notices
            language: system
            entry: npm run --silent licenses:check
            files: ^(package-lock\.json|THIRD-PARTY-NOTICES\.md|LICENSE|scripts/licenses/)
            pass_filenames: false

          # The inputs of CI's "Check policy pages" step.
          - id: policies-check
            name: policy pages
            language: system
            entry: npm run --silent policies:check
            files: ^(policygen\.json|package-lock\.json|scripts/policies/|src/pages/(privacy|terms)/)
            pass_filenames: false

          # Same commands as CI, on push only. They need the generated site data (`npm run prebuild`).
          - id: check
            name: npm run check
            language: system
            entry: npm run --silent check
            files: ^(src/|scripts/|test/|public/|package(-lock)?\.json$|astro\.config\.ts$|vite\.config\.ts$|tsconfig\.json$)
            pass_filenames: false
            stages: [pre-push]

          - id: test
            name: npm test
            language: system
            entry: npm test
            files: ^(src/|scripts/|test/|public/|package(-lock)?\.json$|vite\.config\.ts$)
            pass_filenames: false
            stages: [pre-push]
